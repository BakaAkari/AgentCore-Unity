[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragmem-mcp"
version = "0.1.0"
description = "MCP Server for mem0 (memory) + LightRAG (knowledge base)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
ragmem-mcp-server = "ragmem_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ragmem_mcp"]
