# mem0 Server Configuration Notes
# ================================
# The mem0 server (server/main.py) uses environment variables for configuration,
# NOT a config.yaml file. This file is kept for documentation purposes only.
#
# mem0 server hardcodes the following providers in DEFAULT_CONFIG:
#   - vector_store: pgvector (PostgreSQL with vector extension)
#   - graph_store: neo4j (optional, disabled if NEO4J_URI not set)
#   - llm: openai (OpenAI-compatible API, routed through LiteLLM)
#   - embedder: openai (OpenAI-compatible API, routed through LiteLLM)
#
# Environment variables used by mem0 server:
#   OPENAI_API_KEY      → LiteLLM API key
#   OPENAI_BASE_URL     → LiteLLM endpoint + /v1
#   LLM_MODEL           → Model name (e.g., claude-opus-4-6)
#   EMBEDDER_MODEL      → Embedding model (e.g., text-embedding-3-small)
#   POSTGRES_HOST        → pgvector hostname (default: pgvector)
#   POSTGRES_PORT        → pgvector port (default: 5432)
#   POSTGRES_USER        → PostgreSQL user
#   POSTGRES_PASSWORD    → PostgreSQL password
#   POSTGRES_DB          → PostgreSQL database name
#   NEO4J_URI            → Neo4j bolt URI (optional)
#   NEO4J_USERNAME       → Neo4j username (optional)
#   NEO4J_PASSWORD       → Neo4j password (optional)
#   MEM0_TELEMETRY       → Telemetry toggle (set to "false")
#
# All configuration is done via docker-compose.yml environment section.
# See docker-compose.yml for the actual configuration.
